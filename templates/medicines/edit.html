{% extends "base.html" %}

{% block title %}Edit Medicine{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Edit Medicine</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('medicines.edit_medicine', medicine_id=medicine.medicine_id) }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Medicine Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name"
                                   value="{{ medicine.name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
                            <select class="form-select" id="type" name="type" required>
                                <option value="">Select type...</option>
                                {% for t in ['Analgesic', 'Antibiotic', 'Antihistamine', 'Antifungal', 'Anti-inflammatory', 'Antihypertensive', 'Antidiabetic', 'Bronchodilator', 'Cardiovascular', 'Gastrointestinal', 'Vitamin', 'Other'] %}
                                    <option value="{{ t }}" {% if medicine.type == t %}selected{% endif %}>{{ t }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="strength" class="form-label">Strength <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="strength" name="strength"
                                   value="{{ medicine.strength }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="dosage_form" class="form-label">Dosage Form <span class="text-danger">*</span></label>
                            <select class="form-select" id="dosage_form" name="dosage_form" required>
                                <option value="">Select form...</option>
                                {% for f in ['Tablet', 'Capsule', 'Syrup', 'Injection', 'Cream', 'Ointment', 'Inhaler', 'Drops', 'Suppository', 'Patch'] %}
                                    <option value="{{ f }}" {% if medicine.dosage_form == f %}selected{% endif %}>{{ f }}</option>
                                {% endfor %}
                            </select>
                        </div>
                         <div class="col-md-4 mb-3">
                            <label for="low_stock_threshold" class="form-label">Low Stock Threshold</label>
                            <input type="number" class="form-control" id="low_stock_threshold"
                                   name="low_stock_threshold" value="{{ medicine.low_stock_threshold }}" min="0">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="selling_price" class="form-label">Selling Price (£) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">£</span>
                                <input type="number" class="form-control" id="selling_price"
                                       name="selling_price" step="0.01" min="0"
                                       value="{{ '%.2f'|format(medicine.selling_price or 0) }}" required>
                            </div>
                            <small class="text-muted">Price charged to patients per unit</small>
                        </div>
                    </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description"
                                  rows="3">{{ medicine.description or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('medicines.list_medicines') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-circle"></i> Update Medicine
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
